<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="22%" stop-color="#70AD47"/>
      <stop offset="50%" stop-color="#F2A93B"/>
      <stop offset="75%" stop-color="#E05A4E"/>
      <stop offset="100%" stop-color="#A32B24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <!-- Faces -->
  <!-- Face 1: neutral/happy blue at x=60 -->
  <g>
    <circle cx="60" cy="55" r="30" fill="none" stroke="#5B9BD5" stroke-width="3"/>
    <circle cx="49" cy="46" r="3.2" fill="#5B9BD5"/>
    <circle cx="71" cy="46" r="3.2" fill="#5B9BD5"/>
    <path d="M 46 65 Q 60 75 74 65" stroke="#5B9BD5" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="60" y="112" font-size="21" fill="#333333" text-anchor="middle">통증 없음</text>

  <!-- Face 2: mild smile green at x=280 -->
  <g>
    <circle cx="280" cy="55" r="30" fill="none" stroke="#70AD47" stroke-width="3"/>
    <circle cx="269" cy="46" r="3.2" fill="#70AD47"/>
    <circle cx="291" cy="46" r="3.2" fill="#70AD47"/>
    <path d="M 269 67 Q 280 73 291 67" stroke="#70AD47" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="280" y="112" font-size="21" fill="#333333" text-anchor="middle">경미</text>

  <!-- Face 3: neutral frown orange at x=500 -->
  <g>
    <circle cx="500" cy="55" r="30" fill="none" stroke="#F2A93B" stroke-width="3"/>
    <circle cx="489" cy="46" r="3.2" fill="#F2A93B"/>
    <circle cx="511" cy="46" r="3.2" fill="#F2A93B"/>
    <path d="M 489 72 Q 500 65 511 72" stroke="#F2A93B" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="500" y="112" font-size="21" fill="#333333" text-anchor="middle">중등도</text>

  <!-- Face 4: sad/upset red at x=720 -->
  <g>
    <circle cx="720" cy="55" r="30" fill="none" stroke="#E05A4E" stroke-width="3"/>
    <path d="M 703 42 L 713 47" stroke="#E05A4E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 737 42 L 727 47" stroke="#E05A4E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 705 74 Q 720 63 735 74" stroke="#E05A4E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="720" y="112" font-size="21" fill="#333333" text-anchor="middle">심함</text>

  <!-- Face 5: crying dark red at x=940 -->
  <g>
    <circle cx="940" cy="55" r="30" fill="none" stroke="#A32B24" stroke-width="3"/>
    <path d="M 922 40 L 932 47" stroke="#A32B24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 958 40 L 948 47" stroke="#A32B24" stroke-width="3" stroke-linecap="round"/>
    <path d="M 924 76 Q 940 62 956 76" stroke="#A32B24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 927 50 L 923 62" stroke="#A32B24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 953 50 L 957 62" stroke="#A32B24" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="940" y="112" font-size="21" fill="#333333" text-anchor="middle">극심한 통증</text>

  <!-- Gradient bar -->
  <rect x="60" y="140" width="880" height="26" fill="url(#barGradient)"/>

  <!-- Tick marks -->
  <g stroke="#333333" stroke-width="2">
    <line x1="60" y1="140" x2="60" y2="176"/>
    <line x1="236" y1="140" x2="236" y2="176"/>
    <line x1="500" y1="140" x2="500" y2="176"/>
    <line x1="764" y1="140" x2="764" y2="176"/>
    <line x1="940" y1="140" x2="940" y2="176"/>
  </g>

  <!-- Numbers -->
  <text x="60" y="200" font-size="21" fill="#333333" text-anchor="middle">0</text>
  <text x="236" y="200" font-size="21" fill="#333333" text-anchor="middle">20</text>
  <text x="500" y="200" font-size="21" fill="#333333" text-anchor="middle">50</text>
  <text x="764" y="200" font-size="21" fill="#333333" text-anchor="middle">80</text>
  <text x="940" y="200" font-size="21" fill="#333333" text-anchor="middle">100 mm</text>

  <!-- Instruction -->
  <text x="500" y="245" font-size="24" font-weight="bold" fill="#222222" text-anchor="middle">현재 통증 강도에 해당하는 위치에 수직선을 그어 주십시오.</text>

  <!-- Category boxes -->
  <g>
    <rect x="60" y="280" width="264" height="90" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="192" y="315" font-size="24" font-weight="bold" fill="#4a7fc9" text-anchor="middle">경증</text>
    <text x="192" y="345" font-size="21" fill="#555555" text-anchor="middle">(0-30 mm)</text>
  </g>
  <g>
    <rect x="324" y="280" width="352" height="90" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="500" y="315" font-size="24" font-weight="bold" fill="#e08a2a" text-anchor="middle">중등도</text>
    <text x="500" y="345" font-size="21" fill="#555555" text-anchor="middle">(31-70 mm)</text>
  </g>
  <g>
    <rect x="676" y="280" width="264" height="90" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="808" y="315" font-size="24" font-weight="bold" fill="#c0392b" text-anchor="middle">중증</text>
    <text x="808" y="345" font-size="21" fill="#555555" text-anchor="middle">(71-100 mm)</text>
  </g>

  <!-- Footnote box -->
  <rect x="60" y="395" width="880" height="50" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
  <text x="500" y="426" font-size="18" fill="#777777" text-anchor="middle">실제 임상에서는 100 mm 눈금자 위에 환자가 직접 표시하도록 함</text>
</svg>
